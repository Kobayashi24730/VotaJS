# Nome da aplicação
spring.application.name=vota-js-backend

# Configuração do Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:votedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console do H2 no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Hibernate/JPA: cria/atualiza as tabelas automaticamente com base nas Entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true